<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリを開く</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 40px 20px; color: #333; }
    .code { font-size: 28px; font-weight: bold; letter-spacing: 2px; background: #f2f2f7; border-radius: 8px; padding: 12px 20px; display: inline-block; margin: 16px 0; }
    .btn { display: inline-block; padding: 14px 28px; background-color: #007AFF; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; border: none; font-size: 16px; }
    .hint { color: #999; font-size: 13px; margin-top: 16px; }
    .tagline { color: #999; font-size: 13px; margin-top: 32px; }
  </style>
</head>
<body>
  <h2 id="heading">招待コードをコピーしてApp Storeへ</h2>
  <div id="code-box" class="code" style="display:none;"></div>
  <p id="status"></p>
  <button id="go-button" class="btn" style="display:none;">コードをコピーしてApp Storeへ</button>
  <a id="store-link" href="#" class="btn" style="display:none;">直接App Storeを開く</a>
  <p class="hint" id="hint" style="display:none;">コピーがうまくいかない場合は、上のコードをアプリの招待コード入力欄に手入力してください。</p>
  <p class="tagline">LexiRecall — 答えを見る前に、思い出そう。</p>

  <script>
    // LexiRecallは現状iOS専用。App Store IDが確定次第、下記を実際の値に置換する。
    const STORE_URL_IOS = "https://apps.apple.com/jp/app/lexirecall/id6798550517";

    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    const storeLink = document.getElementById('store-link');
    storeLink.href = STORE_URL_IOS;
    storeLink.style.display = 'inline-block';

    if (code) {
      document.getElementById('code-box').innerText = code;
      document.getElementById('code-box').style.display = 'inline-block';
      document.getElementById('hint').style.display = 'block';

      const goButton = document.getElementById('go-button');
      goButton.style.display = 'inline-block';
      goButton.addEventListener('click', async () => {
        // iOS Safariはクリップボード書き込みに「ユーザー操作の直接のイベント」を要求するため、
        // window.onloadなど自動実行のタイミングでは失敗する。ボタンのクリックイベント内で
        // 呼ぶことで許可される。
        try {
          await navigator.clipboard.writeText(code);
          document.getElementById('status').innerText = 'コピーしました。App Storeへ移動します...';
        } catch (err) {
          document.getElementById('status').innerText = 'コピーに失敗しました。上のコードを手入力してください。';
          console.log('Clipboard copy failed:', err);
        }
        window.location.href = STORE_URL_IOS;
      });
    } else {
      document.getElementById('heading').innerText = 'App Storeへ移動中...';
      setTimeout(() => { window.location.href = STORE_URL_IOS; }, 800);
    }
  </script>
</body>
</html>
