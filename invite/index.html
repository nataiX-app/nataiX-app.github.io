<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiRecall・多言語単語帳アプリ　ダウンロードリンク</title>
  <style>
    :root {
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      margin: 0;
      padding: 32px 20px 48px;
      background: #f5f3ef;
      color: #3a332c;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(75, 64, 56, 0.12);
      padding: 32px 24px 28px;
      text-align: center;
    }
    .icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 4px 14px rgba(75, 64, 56, 0.18);
      margin-bottom: 18px;
    }
    h1 {
      font-size: 19px;
      line-height: 1.5;
      margin: 0 0 6px;
      color: #4b4038;
    }
    .tagline {
      color: #9a8f83;
      font-size: 13px;
      margin: 0 0 24px;
    }
    .code-label {
      font-size: 13px;
      color: #9a8f83;
      margin: 0 0 6px;
    }
    .code {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      background: #f5f3ef;
      border-radius: 10px;
      padding: 12px 18px;
      display: inline-block;
      margin-bottom: 4px;
      color: #4b4038;
      font-family: -apple-system, "SF Mono", Menlo, monospace;
    }
    #status {
      min-height: 20px;
      font-size: 13px;
      color: #7a6f63;
      margin: 8px 0 18px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      background-color: #4b4038;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn:active { opacity: 0.85; }
    .link-secondary {
      display: block;
      margin-top: 14px;
      font-size: 13px;
      color: #9a8f83;
      text-decoration: underline;
    }
    .perk-box {
      text-align: left;
      background: #faf8f5;
      border-radius: 14px;
      padding: 14px 16px;
      margin: 0 0 12px;
    }
    .perk-box-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #4b4038;
      line-height: 1.5;
      margin: 0;
    }
    .perk-box-body {
      font-size: 12.5px;
      line-height: 1.6;
      color: #5a5049;
      margin: 6px 0 0;
      padding-left: 24px;
    }
    .perk-box.solo {
      margin-bottom: 22px;
    }
    .hint {
      color: #9a8f83;
      font-size: 12px;
      margin: 14px 0 0;
      line-height: 1.5;
    }
    .footer-tagline {
      color: #c2b8ac;
      font-size: 12px;
      margin-top: 28px;
    }
  </style>
</head>

    <h1>LexiRecall・多言語単語帳アプリ<br>ダウンロードリンク</h1>
    <p class="tagline">答えを見る前に、思い出そう。</p>

    <div id="code-section" style="display:none;">
      <p class="code-label">招待コード</p>
      <div id="code-box" class="code"></div>
    </div>

    <div class="perk-box">
      <p class="perk-box-title"><span>🔳</span><span>紹介コードを入力すると・・</span></p>
      <p class="perk-box-title">AppleID連携により、あなたと紹介者にAIマイル10が付与されます。</p>
    </div>

    <div class="perk-box solo">
      <p class="perk-box-title"><span>🔳</span><span>今ならAppleID連携で、プレミアム会員の権利を2週間分プレゼント中！！</span></p>
    </div>

    <p id="status"></p>
    <button id="go-button" class="btn" style="display:none;">コードをコピーしてApp Storeへ</button>
    <a id="auto-link" class="btn" href="#" style="display:none;">App Storeで開く</a>
    <a id="store-link" class="link-secondary" href="#" style="display:none;">コードを使わずApp Storeを開く</a>

    <p class="hint" id="hint" style="display:none;">アプリの初回起動時にペーストの許諾を求められた場合は許諾を選んでください。</n>コピーがうまくいかない場合は、上のコードをアプリの招待コード入力欄に手入力してください。</p>
    <p class="footer-tagline">LexiRecall — nataiX</p>
  </div>

  <script>
    const STORE_URL_IOS = "https://apps.apple.com/jp/app/lexirecall/id6798550517";

    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (code) {
      document.getElementById('code-section').style.display = 'block';
      document.getElementById('code-box').innerText = code;
      document.getElementById('hint').style.display = 'block';

      const storeLink = document.getElementById('store-link');
      storeLink.href = STORE_URL_IOS;
      storeLink.style.display = 'block';

      const goButton = document.getElementById('go-button');
      goButton.style.display = 'block';
      goButton.addEventListener('click', async () => {
        // iOS Safariはクリップボード書き込みに「ユーザー操作の直接のイベント」を要求するため、
        // window.onloadなど自動実行のタイミングでは失敗する。ボタンのクリックイベント内で
        // 呼ぶことで許可される。
        try {
          await navigator.clipboard.writeText(code);
          document.getElementById('status').innerText = 'コピーしました。App Storeへ移動します...';
        } catch (err) {
          document.getElementById('status').innerText = 'コピーに失敗しました。上のコードを手入力してください。';
          console.log('Clipboard copy failed:', err);
        }
        window.location.href = STORE_URL_IOS;
      });
    } else {
      const autoLink = document.getElementById('auto-link');
      autoLink.href = STORE_URL_IOS;
      autoLink.style.display = 'block';
      autoLink.innerText = 'App Storeで開く';
      setTimeout(() => { window.location.href = STORE_URL_IOS; }, 800);
    }
  </script>
